<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting Company</title>
    <meta name="description"
      content="Contact Whitewater Rafting Company in Wli, Ghana. Call, email, or send us a message about reservations, trips, or website suggestions">
    <meta name="author" content="Enoch Sagoe">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img
          src="https://byui-cse.github.io/wdd130-ww-course/resources/images/logos/z-raftingcompas.jpg"
          alt="White Water Rafting Image">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="company-info">
            <h1>Whitewater Rafting Company</h1>
            <address>
                246 Main River Street<br>
                Wli, Ghana<br>
                <a href="tel:+233506822575">+233 50 682 2575</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </section>

        <div class="contact-layout">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d31496.831658759584!2d0.5974933297353113!3d7.108408635833839!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sgh!4v1791050184749!5m2!1sen!2sgh"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form class="contact-form">
                <div class="form-item">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
                
                <fieldset class="purpose">
                    <legend>Message Purpose</legend>
                    <div class="radio-item">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        <label for="general">General Inquiry</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </fieldset>
                
                <div class="form-item stacked">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>
                </div>
                
                <div class="radio-item">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>
                
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
            <section class="team">
                <h2>We Are Here to Serve You</h2>
                <div class="team-profiles">
                    <figure>
                        <img src="images/workman-1.jpg" alt="Portrait of Workman-1">
                        <figcaption>Alex Rivers<br>Head River Guide</figcaption>
                    </figure>
                    <figure>
                        <img src="images/abdulrahma2.jpg" alt="Portrait of Abdul Rahma">
                        <figcaption>Sam Carter<br>Safety Director</figcaption>
                    </figure>
                    <figure>
                        <img src="images/sabbir-bhuiyan3.jpg" alt="Portrait of Sabbir">
                        <figcaption>Jordan Lee<br>Reservations Manager</figcaption>
                    </figure>
            </div>
        </section>
    </main>
                
    <footer>
        <p>© 2026 🚣 Whitewater Rafting 🚣 Enoch Sagoe</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                    <img src="images/facebook-square.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.svg" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
